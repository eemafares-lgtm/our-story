<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>إحنا الاتنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep:#26060f;
    --wine:#3c0f1f;
    --wine-light:#5a1830;
    --gold:#c9a24b;
    --gold-light:#e9d6a0;
    --blush:#f6dce3;
    --ivory:#fbf1e3;
    --ink:#3a1220;
    --ink-soft:#6b3346;
    --danger:#c0524a;
    --shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Cairo', sans-serif;
    background: radial-gradient(120% 120% at 50% -10%, var(--wine-light), var(--wine-deep) 60%);
    color: var(--blush);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  :focus-visible{ outline: 2px solid var(--gold-light); outline-offset:3px; border-radius:6px; }

  /* ambient floating hearts */
  #bgFx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .floatHeart{
    position:absolute; bottom:-10%; font-size:1.2rem; color:var(--gold);
    opacity:.18; animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.22; }
    90%{ opacity:.18; }
    100%{ transform:translateY(-115vh) translateX(20px) rotate(20deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .floatHeart{ animation:none; display:none; }
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  #app{ position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; }
  .screen{ width:100%; max-width:520px; }
  .hidden{ display:none !important; }

  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    border:1px solid rgba(233,214,160,.25);
    border-radius:22px;
    padding:34px 26px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(2px);
  }

  /* ---------- loading ---------- */
  #loadingScreen{ text-align:center; }
  .loadHeart{ font-size:2.2rem; color:var(--gold); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:.7;} 50%{ transform:scale(1.18); opacity:1;} }
  .loadText{ margin-top:10px; color:var(--gold-light); font-size:.95rem; }

  /* ---------- lock screen ---------- */
  #lockScreen .card{ text-align:center; }
  .seal{ width:92px; height:92px; margin:0 auto 18px; position:relative; }
  .seal svg{ width:100%; height:100%; filter: drop-shadow(0 6px 14px rgba(201,162,75,.35)); }
  .seal.shake{ animation: shake .45s; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-8px); }
    40%,60%{ transform:translateX(8px); }
  }
  .lockTitle{ font-family:'Aref Ruqaa', serif; font-size:1.9rem; color:var(--gold-light); margin-bottom:6px; }
  .lockSub{ color:var(--blush); opacity:.75; font-size:.9rem; margin-bottom:22px; }
  .pwRow{ display:flex; gap:8px; margin-bottom:10px; }
  input[type="password"], input[type="text"], input[type="datetime-local"], textarea{
    width:100%; background: rgba(0,0,0,.25); border:1px solid rgba(233,214,160,.3);
    color: var(--ivory); border-radius:12px; padding:13px 14px; font-family:'Cairo',sans-serif;
    font-size:1rem;
  }
  input::placeholder, textarea::placeholder{ color: rgba(246,220,227,.4); }
  .toggleEye{ background:rgba(255,255,255,.06); border:1px solid rgba(233,214,160,.3); border-radius:12px; color:var(--gold-light); width:48px; cursor:pointer; font-size:1.1rem; }
  .btn{
    width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:1rem; margin-top:14px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color:#2a1206; transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow:0 10px 22px rgba(201,162,75,.3); }
  .btn:active{ transform: translateY(0); }
  .btnGhost{
    background:transparent; border:1px solid rgba(233,214,160,.4); color:var(--gold-light);
  }
  .errMsg{ color:#ff9c93; font-size:.85rem; margin-top:10px; min-height:1.1em; }

  /* ---------- setup screen ---------- */
  .setupTitle{ font-family:'Aref Ruqaa', serif; font-size:1.6rem; color:var(--gold-light); margin-bottom:4px; text-align:center; }
  .setupSub{ text-align:center; color:var(--blush); opacity:.7; font-size:.85rem; margin-bottom:22px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.85rem; color:var(--gold-light); margin-bottom:6px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  textarea{ min-height:110px; resize:vertical; line-height:1.6; }
  .photoPicker{
    border:1.5px dashed rgba(233,214,160,.4); border-radius:14px; padding:18px; text-align:center;
    cursor:pointer; color:var(--gold-light); font-size:.9rem;
  }
  .photoPicker input{ display:none; }
  .thumbGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .thumb{ position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; border:1px solid rgba(233,214,160,.25); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{
    position:absolute; top:4px; left:4px; background:rgba(20,4,10,.75); color:var(--gold-light);
    border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:.85rem; line-height:1;
  }
  .uploadStatus{ text-align:center; font-size:.82rem; color:var(--gold-light); margin-top:10px; }
  .setupActions{ display:flex; gap:10px; margin-top:6px; }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

  /* ---------- main screen ---------- */
  #mainScreen{ max-width:560px; }
  .topBar{ display:flex; justify-content:space-between; margin-bottom:16px; }
  .iconBtn{
    background:rgba(255,255,255,.05); border:1px solid rgba(233,214,160,.3); color:var(--gold-light);
    border-radius:10px; padding:8px 12px; font-size:.85rem; cursor:pointer; font-family:'Cairo',sans-serif;
  }
  .heroCard{ text-align:center; padding-bottom:26px; }
  .namesRow{ font-family:'Aref Ruqaa', serif; font-size:1.7rem; color:var(--gold-light); margin-bottom:2px; }
  .namesRow .heart{ color:var(--gold); display:inline-block; animation: pulse 1.4s ease-in-out infinite; margin:0 6px; }
  .heroLead{ color:var(--blush); opacity:.75; font-size:.9rem; margin-top:14px; }
  .heroNumber{
    font-size: clamp(3.2rem, 16vw, 4.6rem); font-weight:800; line-height:1;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:4px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .heroUnit{ color:var(--gold-light); font-size:1rem; margin-bottom:16px; }
  .subCounter{ display:flex; justify-content:center; gap:22px; margin-bottom:14px; }
  .subCounter div{ text-align:center; }
  .subCounter span{ display:block; font-size:1.4rem; font-weight:700; color:var(--ivory); font-variant-numeric: tabular-nums; }
  .subCounter label{ font-size:.72rem; color:var(--blush); opacity:.65; }
  .heroDate{ font-size:.8rem; color:var(--blush); opacity:.6; margin-top:6px; }

  .sectionTitle{ font-family:'Aref Ruqaa', serif; font-size:1.35rem; color:var(--gold-light); margin: 26px 4px 12px; text-align:center; }

  .gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .gallery img{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; cursor:pointer;
    border:1px solid rgba(233,214,160,.25); transition: transform .2s ease;
  }
  .gallery img:hover{ transform: scale(1.03); }
  .emptyGallery{ text-align:center; color:var(--blush); opacity:.6; font-size:.85rem; padding:20px; }

  .letterCard{
    background: linear-gradient(180deg, var(--ivory), #f3e6d3);
    color: var(--ink); border-radius:16px; padding:28px 24px; position:relative;
    box-shadow: var(--shadow);
  }
  .letterCard::before{
    content:"“"; font-family:'Aref Ruqaa', serif; font-size:3.5rem; color: var(--gold);
    position:absolute; top:-6px; right:20px; opacity:.5;
  }
  .letterText{ font-size:1.05rem; line-height:2; white-space:pre-wrap; color: var(--ink); }
  .letterSign{ margin-top:16px; text-align:left; font-family:'Aref Ruqaa', serif; color: var(--ink-soft); font-size:1.1rem; }

  .footerActions{ display:flex; justify-content:center; gap:10px; margin-top:28px; }

  /* lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(10,2,6,.92); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  #lightbox img{ max-width:100%; max-height:85vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.6); }

  @media (max-width:380px){
    .card{ padding:26px 18px; }
    .heroNumber{ font-size: clamp(2.6rem, 18vw, 3.6rem); }
  }
</style>
</head>
<body>

<div id="bgFx"></div>

<div id="app">

  <div id="loadingScreen" class="screen">
    <div style="text-align:center">
      <div class="loadHeart">♥</div>
      <div class="loadText">بنجهزلك الحكاية...</div>
    </div>
  </div>

  <!-- LOCK SCREEN -->
  <div id="lockScreen" class="screen hidden">
    <div class="card">
      <div class="seal" id="sealEl">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="#c9a24b" stroke-width="2" opacity="0.5"/>
          <path d="M50 78 C20 58, 10 38, 27 25 C38 17, 50 24, 50 36 C50 24, 62 17, 73 25 C90 38, 80 58, 50 78 Z" fill="url(#g1)"/>
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e9d6a0"/><stop offset="1" stop-color="#c9a24b"/>
          </linearGradient></defs>
        </svg>
      </div>
      <div class="lockTitle">حكايتنا الخاصة</div>
      <div class="lockSub">المكان ده ليكي انتي وبس... ادخلي كلمة السر</div>
      <div class="pwRow">
        <input type="password" id="lockPasswordInput" placeholder="كلمة السر" autocomplete="off">
        <button class="toggleEye" id="lockEyeBtn" type="button">👁</button>
      </div>
      <button class="btn" id="unlockBtn">افتحي القلب 💛</button>
      <div class="errMsg" id="lockErr"></div>
    </div>
  </div>

  <!-- SETUP / EDIT SCREEN -->
  <div id="setupScreen" class="screen hidden">
    <div class="card">
      <div class="setupTitle" id="setupTitleText">ابدأ اكتب حكايتكم</div>
      <div class="setupSub" id="setupSubText">هتدخل التفاصيل مرة واحدة، والموقع هيحفظها ليك</div>

      <div class="row2">
        <div class="field">
          <label>اسمك</label>
          <input type="text" id="nameMe" placeholder="مثلاً: فارس">
        </div>
        <div class="field">
          <label>اسم حبيبتك</label>
          <input type="text" id="nameHer" placeholder="اسمها">
        </div>
      </div>

      <div class="field">
        <label>إمتى عرفتوا بعض؟ (التاريخ والساعة)</label>
        <input type="datetime-local" id="startDateInput">
      </div>

      <div class="field">
        <label>كلمة السر (اللي هتفتح بيها الموقع)</label>
        <div class="pwRow">
          <input type="password" id="setupPassword" placeholder="اكتب كلمة سر سهلة تتفكرها">
          <button class="toggleEye" id="setupEyeBtn" type="button">👁</button>
        </div>
      </div>

      <div class="field">
        <label>رسالتك ليها 💌</label>
        <textarea id="messageInput" placeholder="اكتب اللي في قلبك ليها..."></textarea>
      </div>

      <div class="field">
        <label>صوركم مع بعض</label>
        <div class="photoPicker" id="photoPickerBtn">
          📷 دوس هنا وضيف صور
          <input type="file" id="photoInput" accept="image/*" multiple>
        </div>
        <div class="uploadStatus hidden" id="uploadStatus"></div>
        <div class="thumbGrid" id="thumbGrid"></div>
      </div>

      <div class="errMsg" id="setupErr"></div>

      <div class="setupActions">
        <button class="btn btnGhost hidden" id="cancelSetupBtn" type="button">إلغاء</button>
        <button class="btn" id="saveSetupBtn" type="button">احفظ 💛</button>
      </div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="mainScreen" class="screen hidden">
    <div class="topBar">
      <button class="iconBtn" id="lockNowBtn">🔒 قفل</button>
      <button class="iconBtn" id="editBtn">⚙️ تعديل</button>
    </div>

    <div class="card heroCard">
      <div class="namesRow"><span id="displayNameMe"></span><span class="heart">♥</span><span id="displayNameHer"></span></div>
      <div class="heroLead">إحنا مع بعض من</div>
      <div class="heroNumber" id="dayCount">0</div>
      <div class="heroUnit">يوم</div>
      <div class="subCounter">
        <div><span id="hourCount">00</span><label>ساعة</label></div>
        <div><span id="minCount">00</span><label>دقيقة</label></div>
        <div><span id="secCount">00</span><label>ثانية</label></div>
      </div>
      <div class="heroDate" id="startDateText"></div>
    </div>

    <div class="sectionTitle">لحظاتنا 📷</div>
    <div class="gallery" id="galleryGrid"></div>

    <div class="sectionTitle">ليكي 💌</div>
    <div class="letterCard">
      <div class="letterText" id="letterText"></div>
      <div class="letterSign" id="letterSign"></div>
    </div>

  </div>

</div>

<script>
(function(){
  // ---------- ambient floating hearts ----------
  const bgFx = document.getElementById('bgFx');
  for(let i=0;i<14;i++){
    const h = document.createElement('div');
    h.className = 'floatHeart';
    h.textContent = '♥';
    h.style.left = Math.random()*100 + '%';
    h.style.animationDuration = (10 + Math.random()*10) + 's';
    h.style.animationDelay = (Math.random()*10) + 's';
    h.style.fontSize = (0.8 + Math.random()*1.2) + 'rem';
    bgFx.appendChild(h);
  }

  const screens = {
    loading: document.getElementById('loadingScreen'),
    lock: document.getElementById('lockScreen'),
    setup: document.getElementById('setupScreen'),
    main: document.getElementById('mainScreen'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  const STORAGE_KEY = 'love_data';
  let appData = null;         // { config:{nameMe,nameHer,startDateTime,password,message}, photos:[Cloudinary URLs] }
  let tempPhotos = [];        // used while in setup/edit screen
  let isEditMode = false;
  let counterInterval = null;

  async function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      return null;
    }
  }
  async function saveData(data){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    }catch(e){
      console.error('storage save failed', e);
      return false;
    }
  }

  // ---------- Cloudinary upload ----------
  const CLOUDINARY_CLOUD_NAME = 'ybzcdiht';
  const CLOUDINARY_UPLOAD_PRESET = 'ml_default';

  function resizeImageToBlob(file, maxDim, quality){
    maxDim = maxDim || 1280; quality = quality || 0.75;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
          else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob)=>{
            if(blob) resolve(blob); else reject(new Error('canvas toBlob failed'));
          }, 'image/jpeg', quality);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadToCloudinary(blob){
    const formData = new FormData();
    formData.append('file', blob);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', {
      method: 'POST',
      body: formData
    });
    if(!res.ok){
      throw new Error('Cloudinary upload failed with status ' + res.status);
    }
    const data = await res.json();
    if(!data.secure_url){
      throw new Error('Cloudinary response missing secure_url');
    }
    return data.secure_url;
  }

  // ---------- setup screen logic ----------
  const photoPickerBtn = document.getElementById('photoPickerBtn');
  const photoInput = document.getElementById('photoInput');
  const thumbGrid = document.getElementById('thumbGrid');

  const uploadStatusEl = document.getElementById('uploadStatus');
  let isUploading = false;

  photoPickerBtn.addEventListener('click', ()=>{ if(!isUploading) photoInput.click(); });
  photoInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    photoInput.value = '';
    if(files.length === 0) return;

    const errEl = document.getElementById('setupErr');
    const saveBtn = document.getElementById('saveSetupBtn');
    errEl.textContent = '';
    isUploading = true;
    saveBtn.disabled = true;
    uploadStatusEl.classList.remove('hidden');

    for(let i=0; i<files.length; i++){
      uploadStatusEl.textContent = 'بيرفع صورة ' + (i+1) + ' من ' + files.length + '... 📤';
      try{
        const blob = await resizeImageToBlob(files[i]);
        const url = await uploadToCloudinary(blob);
        tempPhotos.push(url);
        renderThumbs();
      }catch(err){
        console.error(err);
        errEl.textContent = 'حصل مشكلة في رفع إحدى الصور، جرب تاني.';
      }
    }

    uploadStatusEl.classList.add('hidden');
    uploadStatusEl.textContent = '';
    saveBtn.disabled = false;
    isUploading = false;
  });
  function renderThumbs(){
    thumbGrid.innerHTML = '';
    tempPhotos.forEach((src, idx)=>{
      const div = document.createElement('div');
      div.className = 'thumb';
      const img = document.createElement('img');
      img.src = src;
      const btn = document.createElement('button');
      btn.textContent = '×';
      btn.type = 'button';
      btn.addEventListener('click', ()=>{ tempPhotos.splice(idx,1); renderThumbs(); });
      div.appendChild(img); div.appendChild(btn);
      thumbGrid.appendChild(div);
    });
  }

  function openSetup(editMode){
    isEditMode = !!editMode;
    document.getElementById('setupErr').textContent = '';
    document.getElementById('cancelSetupBtn').classList.toggle('hidden', !isEditMode);
    if(isEditMode && appData){
      document.getElementById('setupTitleText').textContent = 'عدّل حكايتكم';
      document.getElementById('setupSubText').textContent = 'اتركي كلمة السر فاضية لو مش عايزة تغيريها';
      document.getElementById('nameMe').value = appData.config.nameMe || '';
      document.getElementById('nameHer').value = appData.config.nameHer || '';
      document.getElementById('startDateInput').value = appData.config.startDateTime || '';
      document.getElementById('setupPassword').value = '';
      document.getElementById('setupPassword').placeholder = 'اتركيه فاضي لو هتسيبي نفس كلمة السر';
      document.getElementById('messageInput').value = appData.config.message || '';
      tempPhotos = (appData.photos || []).slice();
    } else {
      document.getElementById('setupTitleText').textContent = 'ابدأ اكتب حكايتكم';
      document.getElementById('setupSubText').textContent = 'هتدخل التفاصيل مرة واحدة، والموقع هيحفظها ليك';
      document.getElementById('nameMe').value = '';
      document.getElementById('nameHer').value = '';
      document.getElementById('startDateInput').value = '';
      document.getElementById('setupPassword').value = '';
      document.getElementById('setupPassword').placeholder = 'اكتب كلمة سر سهلة تتفكرها';
      document.getElementById('messageInput').value = '';
      tempPhotos = [];
    }
    renderThumbs();
    showScreen('setup');
  }

  document.getElementById('cancelSetupBtn').addEventListener('click', ()=>{
    if(appData){ showScreen('main'); } else { showScreen('lock'); }
  });

  document.getElementById('saveSetupBtn').addEventListener('click', async ()=>{
    const errEl = document.getElementById('setupErr');
    errEl.textContent = '';
    if(isUploading){ errEl.textContent = 'استني الصور تخلص رفع الأول.'; return; }
    const nameMe = document.getElementById('nameMe').value.trim();
    const nameHer = document.getElementById('nameHer').value.trim();
    const startDateTime = document.getElementById('startDateInput').value;
    const pw = document.getElementById('setupPassword').value;
    const message = document.getElementById('messageInput').value.trim();

    if(!nameMe || !nameHer){ errEl.textContent = 'اكتب الاسمين الأول'; return; }
    if(!startDateTime){ errEl.textContent = 'اختار تاريخ وساعة ارتباطكم'; return; }
    if(!isEditMode && !pw){ errEl.textContent = 'لازم تحط كلمة سر'; return; }

    const finalPassword = pw ? pw : (appData ? appData.config.password : '');

    const newData = {
      config: { nameMe, nameHer, startDateTime, password: finalPassword, message },
      photos: tempPhotos
    };

    document.getElementById('saveSetupBtn').textContent = 'بنحفظ...';
    const ok = await saveData(newData);
    document.getElementById('saveSetupBtn').textContent = 'احفظ 💛';

    if(!ok){
      errEl.textContent = 'حصل مشكلة في الحفظ، جرب تقلل عدد الصور أو حاول تاني.';
      return;
    }
    appData = newData;
    renderMain();
    showScreen('main');
  });

  // ---------- lock screen logic ----------
  const lockPasswordInput = document.getElementById('lockPasswordInput');
  document.getElementById('lockEyeBtn').addEventListener('click', ()=>{
    lockPasswordInput.type = lockPasswordInput.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('setupEyeBtn').addEventListener('click', ()=>{
    const el = document.getElementById('setupPassword');
    el.type = el.type === 'password' ? 'text' : 'password';
  });

  async function tryUnlock(){
    const errEl = document.getElementById('lockErr');
    const val = lockPasswordInput.value;
    if(appData && val === appData.config.password){
      errEl.textContent = '';
      lockPasswordInput.value = '';
      renderMain();
      showScreen('main');
    } else {
      errEl.textContent = 'كلمة السر غلط، جربي تاني 💛';
      const seal = document.getElementById('sealEl');
      seal.classList.remove('shake'); void seal.offsetWidth; seal.classList.add('shake');
    }
  }
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  lockPasswordInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });

  document.getElementById('lockNowBtn').addEventListener('click', ()=>{
    if(counterInterval) clearInterval(counterInterval);
    showScreen('lock');
  });
  document.getElementById('editBtn').addEventListener('click', ()=> openSetup(true));

  // ---------- main screen rendering ----------
  function renderMain(){
    if(!appData) return;
    const c = appData.config;
    document.getElementById('displayNameMe').textContent = c.nameMe;
    document.getElementById('displayNameHer').textContent = c.nameHer;

    const start = new Date(c.startDateTime);
    const dateStr = start.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
    const timeStr = start.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('startDateText').textContent = 'من يوم ' + dateStr + ' الساعة ' + timeStr;

    document.getElementById('letterText').textContent = c.message || '...';
    document.getElementById('letterSign').textContent = '– ' + c.nameMe;

    const gallery = document.getElementById('galleryGrid');
    gallery.innerHTML = '';
    const photos = appData.photos || [];
    if(photos.length === 0){
      gallery.innerHTML = '<div class="emptyGallery">لسه مفيش صور، ضيفها من زرار ⚙️ تعديل</div>';
    } else {
      photos.forEach(src=>{
        const img = document.createElement('img');
        img.src = src;
        img.addEventListener('click', ()=> openLightbox(src));
        gallery.appendChild(img);
      });
    }

    if(counterInterval) clearInterval(counterInterval);
    function tick(){
      const now = new Date();
      let diffMs = now - start;
      if(diffMs < 0) diffMs = 0;
      const totalSec = Math.floor(diffMs/1000);
      const days = Math.floor(totalSec/86400);
      const hours = Math.floor((totalSec%86400)/3600);
      const mins = Math.floor((totalSec%3600)/60);
      const secs = totalSec%60;
      document.getElementById('dayCount').textContent = days;
      document.getElementById('hourCount').textContent = String(hours).padStart(2,'0');
      document.getElementById('minCount').textContent = String(mins).padStart(2,'0');
      document.getElementById('secCount').textContent = String(secs).padStart(2,'0');
    }
    tick();
    counterInterval = setInterval(tick, 1000);
  }

  function openLightbox(src){
    const box = document.createElement('div');
    box.id = 'lightbox';
    const img = document.createElement('img');
    img.src = src;
    box.appendChild(img);
    box.addEventListener('click', ()=> box.remove());
    document.body.appendChild(box);
  }

  // ---------- boot ----------
  (async function boot(){
    showScreen('loading');
    appData = await loadData();
    if(!appData){
      openSetup(false);
    } else {
      showScreen('lock');
    }
  })();

})();
</script>
</body>
</html>
